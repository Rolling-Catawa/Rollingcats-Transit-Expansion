name: 功能建议 / Feature request
description: 新功能或改进 / New feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 请描述场景，而不是直接给方案。Describe the situation rather than jumping to a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法 / Proposed approach
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过 / Current workaround
      description: 别的附属有类似功能吗？Does another addon already do something similar?
    validations:
      required: false
