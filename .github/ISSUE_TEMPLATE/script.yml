name: JS 脚本问题 / Script issue
description: 资源包脚本报错、渲染异常或 API 疑问 / Script errors, wrong rendering, or API questions
labels: ["scripting"]
body:
  - type: input
    id: rte-version
    attributes:
      label: RTE 版本 / RTE version
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: JS 引擎 / JS engine
      description: 见 config/rte.json 的 scriptEngine 项。See `scriptEngine` in `config/rte.json`.
      options:
        - rhino
        - graal
        - auto
    validations:
      required: true

  - type: input
    id: pack
    attributes:
      label: 资源包 / Resource pack
      description: 来源与版本；若为自制请说明。Source and version; say so if self-made.
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: 相关脚本片段 / Relevant script snippet
      render: javascript
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Log
      description: 请附 `logs/latest.log`，脚本报错会带 `Error in RTE Resource Pack JavaScript`。Attach `logs/latest.log`; script errors are tagged `Error in RTE Resource Pack JavaScript`.
    validations:
      required: true
